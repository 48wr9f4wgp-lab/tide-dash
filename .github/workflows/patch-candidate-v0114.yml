name: Patch TIDE DASH v0.11.4 candidate

on:
  push:
    paths:
      - "scripts/patch_candidate_v0114.py"
      - ".github/workflows/patch-candidate-v0114.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Patch candidate and manifest
        run: python scripts/patch_candidate_v0114.py
      - name: Syntax check candidate
        run: node --check app-candidate.js
      - name: Visual QA guard
        run: |
          grep -q 'TIDE DASH v0.11.4' app-candidate.js
          grep -q 'firstGrid=Math.ceil(t.graphStart/360)' app-candidate.js
          grep -q 'rowLabel=firstDay===1?"明日"' app-candidate.js
          grep -q '"candidateVersion":"0.11.4"' manifest.json
      - name: Commit candidate
        run: |
          if git diff --quiet -- app-candidate.js manifest.json; then
            echo "Candidate already patched"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app-candidate.js manifest.json
          git commit -m "TIDE DASH v0.11.4: round graph ticks and clarify next-day row"
          git push
