# Auto-maintained station catalog for TIDE DASH
name: Update JMA tide stations

on:
  push:
    paths:
      - "scripts/update_stations.py"
      - ".github/workflows/update-stations.yml"
  schedule:
    - cron: "17 18 * * 0"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build station catalog
        run: python scripts/update_stations.py
      - name: Commit changes
        run: |
          if git diff --quiet -- stations.json; then
            echo "No station changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stations.json
          git commit -m "chore: refresh JMA tide station catalog"
          git push
