name: Patch TIDE DASH v0.11.8 candidate

on:
  push:
    paths:
      - '.github/workflows/patch-candidate-v0118.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build v0.11.8 candidate from stable
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          p = Path('app-stable.js')
          s = p.read_text()
          s = s.replace('// TIDE DASH v0.11.7 — Medium Hardening: compact hierarchy / tap regression prep',
                        '// TIDE DASH v0.11.8 — Signed Tide Level: explicit datum-relative current height')

          marker = 'const f1=(v,s="")=>v==null?"--":`${Number(v).toFixed(1)}${s}`;'
          helper = marker + '\nconst signedTide=v=>{const n=Math.round(Number(v));return !Number.isFinite(n)?"--":n>0?`+${n}`:n<0?`−${Math.abs(n)}`:"0"};'
          if marker not in s:
              raise SystemExit('f1 marker not found')
          s = s.replace(marker, helper, 1)

          old = '`${Math.round(t.current)} cm`'
          count = s.count(old)
          if count != 2:
              raise SystemExit(f'expected 2 current tide renderers, found {count}')
          s = s.replace(old, '`${signedTide(t.current)} cm`')

          Path('app-candidate.js').write_text(s)
          manifest = {
              'schemaVersion': 1,
              'stableVersion': '0.11.7',
              'stableURL': 'https://raw.githubusercontent.com/48wr9f4wgp-lab/tide-dash/main/app-stable.js',
              'candidateVersion': '0.11.8',
              'candidateURL': 'https://raw.githubusercontent.com/48wr9f4wgp-lab/tide-dash/main/app-candidate.js',
              'candidateEnabled': True,
              'updatedAt': '2026-09-14T13:40:00+09:00'
          }
          Path('manifest.json').write_text(json.dumps(manifest, ensure_ascii=False, separators=(',', ':')) + '\n')
          PY
      - name: Syntax and release guard
        run: |
          node --check app-candidate.js
          grep -q 'signedTide(t.current)' app-candidate.js
          grep -q 'candidateVersion":"0.11.8' manifest.json
          grep -q 'candidateEnabled":true' manifest.json
      - name: Commit candidate
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app-candidate.js manifest.json
          git commit -m 'TIDE DASH v0.11.8: show signed current tide level'
          git push
