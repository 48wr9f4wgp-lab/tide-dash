name: Release TIDE DASH v0.11 candidate

on:
  push:
    paths:
      - "scripts/release_v011.py"
      - ".github/workflows/release-v011.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Promote stable and build candidate
        run: python scripts/release_v011.py
      - name: Syntax check
        run: |
          node --check app-stable.js
          node --check app-candidate.js
          node --check main.js
      - name: Commit release files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app-stable.js app-candidate.js manifest.json
          git commit -m "TIDE DASH v0.11 beginner guide candidate"
          git push
